<form id="movie-filter-form" method="get" class="row g-3 bg-dark text-light p-3 rounded border border-secondary">
    <div class="col-md-4">
        <input type="text" name="q" class="form-control bg-secondary text-light" placeholder="Search by title..." value="{{ selected_q }}">
    </div>
    <div class="col-md-3">
        <select name="genre" class="form-select bg-secondary text-light">
            <option value="">All Genres</option>
            {% for g in genres %}
            <option value="{{ g.slug }}" {% if selected_genre == g.slug %}selected{% endif %}>{{ g.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-3">
        <select name="language" class="form-select bg-secondary text-light">
            <option value="">All Languages</option>
            {% for l in languages %}
            <option value="{{ l.code }}" {% if selected_language == l.code %}selected{% endif %}>{{ l.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div class="col-md-2">
        <button type="submit" class="btn btn-primary w-100">Filter</button>
    </div>
</form>
