{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
    <h2 class="text-light mb-4">Now Showing & Discover Movies</h2>
    {% include 'movies/movie_search.html' %}
    <div class="row row-cols-1 row-cols-md-3 g-4 mt-2">
        {% for movie in page_obj %}
        <div class="col">
            <div class="card bg-dark text-light border-secondary h-100 shadow-sm">
                <img src="{{ movie.poster_image }}" class="card-img-top" alt="{{ movie.title }}" style="height: 320px; object-fit: cover;">
                <div class="card-body">
                    <h5 class="card-title">{{ movie.title }}</h5>
                    <p class="card-text text-muted">{{ movie.description|truncatewords:15 }}</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="badge bg-warning text-dark">★ {{ movie.average_rating }}</span>
                        <a href="{% url 'movies:detail' movie.slug %}" class="btn btn-outline-primary btn-sm">Book Tickets</a>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
