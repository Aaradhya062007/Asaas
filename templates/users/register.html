{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card bg-dark text-light border-danger p-4 shadow">
            <h3 class="card-title text-center text-danger mb-4">Create an Account</h3>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-danger w-100 fw-bold py-2 mt-3">Register Now</button>
            </form>
            <div class="text-center mt-3">
                <small class="text-white">Already registered? <a href="{% url 'users:login' %}" class="text-danger fw-bold">Login here</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
