<div class="card bg-dark border-danger p-3 mb-4">
    <h4 class="text-white">Revenue Trends & Theater Occupancy</h4>
    <div class="table-responsive mt-3">
        <table class="table table-dark table-striped">
            <thead>
                <tr>
                    <th>Theater</th>
                    <th>City</th>
                    <th>Booked Seats</th>
                    <th>Revenue</th>
                    <th>Occupancy %</th>
                </tr>
            </thead>
            <tbody>
                {% for t in theater_occupancy %}
                <tr>
                    <td>{{ t.name }}</td>
                    <td>{{ t.city }}</td>
                    <td>{{ t.booked_seats }}</td>
                    <td class="text-danger fw-bold">₹{{ t.revenue }}</td>
                    <td><span class="badge bg-danger">{{ t.occupancy_percentage }}%</span></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
