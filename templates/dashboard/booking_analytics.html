<div class="card bg-dark border-danger p-3 mb-4">
    <h4 class="text-white">Top Performing Movies</h4>
    <div class="table-responsive mt-3">
        <table class="table table-dark table-hover">
            <thead>
                <tr>
                    <th>Movie Title</th>
                    <th>Bookings</th>
                    <th>Seats Sold</th>
                    <th>Revenue</th>
                </tr>
            </thead>
            <tbody>
                {% for m in most_booked_movies %}
                <tr>
                    <td>{{ m.title }}</td>
                    <td>{{ m.total_bookings }}</td>
                    <td>{{ m.total_seats_sold }}</td>
                    <td class="text-danger fw-bold">₹{{ m.total_revenue|default:0 }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
