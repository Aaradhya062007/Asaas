{% extends 'base.html' %}
{% block content %}
<div class="container py-4 text-center">
    <div class="card bg-dark text-light border-success p-5">
        <h2 class="text-success">🎉 Booking Confirmed!</h2>
        <p class="lead">Booking ID: <strong>{{ booking.booking_id }}</strong></p>
        <p>Movie: {{ booking.show_schedule.movie.title }}</p>
        <p>Showtime: {{ booking.show_schedule.start_time|date:"D, M j, Y @ h:i A" }}</p>
        <a href="{% url 'bookings:download_ticket_pdf' booking.booking_id %}" class="btn btn-primary mt-3">Download PDF Ticket</a>
    </div>
</div>
{% endblock %}
