{% extends 'base.html' %}
{% block content %}
<div class="container py-4">
    <h2 class="text-light mb-4">My Bookings</h2>
    <div class="list-group">
        {% for b in bookings %}
        <div class="list-group-item bg-dark text-light border-secondary d-flex justify-content-between align-items-center">
            <div>
                <h5>{{ b.show_schedule.movie.title }}</h5>
                <small class="text-white">Booking ID: {{ b.booking_id }} | Amount: <span class="text-danger fw-bold">₹{{ b.total_amount }}</span></small>
            </div>
            <a href="{% url 'bookings:download_ticket_pdf' b.booking_id %}" class="btn btn-sm btn-outline-danger">Ticket PDF</a>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
