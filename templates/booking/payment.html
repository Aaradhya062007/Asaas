{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card bg-dark text-light border-secondary p-4 shadow">
            <h3 class="card-title text-primary">Checkout Payment</h3>
            <p><strong>Booking ID:</strong> {{ booking.booking_id }}</p>
            <p><strong>Movie:</strong> {{ booking.show_schedule.movie.title }}</p>
            <p><strong>Total Amount:</strong> ₹{{ booking.total_amount }}</p>

            <form method="post" action="{% url 'bookings:process_payment' booking.booking_id %}">
                {% csrf_token %}
                <input type="hidden" name="payment_action" value="simulate_success">
                <button type="submit" class="btn btn-danger w-100 fw-bold py-2 mt-3">Pay ₹{{ booking.total_amount }} (Stripe / Razorpay)</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
