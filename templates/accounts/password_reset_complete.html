{% extends 'base.html' %}

{% block title %}Password Reset Complete - BookMySeat{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="glass-card rounded-3xl p-8 border border-green-200 text-center space-y-6 shadow-lg">
        <div class="w-14 h-14 bg-green-100 rounded-full flex items-center justify-center mx-auto">
            <svg class="w-7 h-7 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>

        <div class="space-y-2">
            <h1 class="font-heading text-2xl font-extrabold text-zinc-900">Password Reset Complete</h1>
            <p class="text-sm text-zinc-600">
                Your password has been successfully set. You can now log in with your new password.
            </p>
        </div>

        <div class="pt-4">
            <a href="{% url 'accounts:login' %}" class="inline-block btn-gradient px-8 py-3.5 rounded-xl font-bold text-white text-sm shadow-xl">
                Log In Now
            </a>
        </div>
    </div>
</div>
{% endblock %}
