{% extends 'base.html' %}

{% block title %}Reset Password - BookMySeat{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="glass-card rounded-3xl p-8 border border-red-200 space-y-6 shadow-lg">
        <div class="text-center">
            <div class="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-3">
                <svg class="w-6 h-6 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
                </svg>
            </div>
            <h1 class="font-heading text-3xl font-extrabold text-zinc-900">Forgot Password?</h1>
            <p class="text-xs text-zinc-600 mt-1">Enter your registered email address and we'll send you a link to reset your password.</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold text-zinc-700 mb-1">Email Address</label>
                <input type="email" name="email" required autocomplete="email" class="w-full bg-white border border-zinc-300 rounded-xl px-4 py-3 text-sm text-zinc-900 focus:outline-none focus:border-red-600 shadow-sm" placeholder="name@example.com">
            </div>

            <button type="submit" class="btn-gradient w-full py-3.5 rounded-xl font-bold text-white text-sm shadow-xl">
                Send Reset Link
            </button>
        </form>

        <div class="text-center space-y-2 pt-2 border-t border-zinc-100">
            <p class="text-xs text-zinc-600">
                Remembered your password? <a href="{% url 'accounts:login' %}" class="text-red-600 font-bold hover:underline">Log In</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
