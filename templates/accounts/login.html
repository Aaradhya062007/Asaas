{% extends 'base.html' %}

{% block title %}Log In - BookMySeat{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-16">
    <div class="glass-card rounded-3xl p-8 border border-red-200 space-y-6 shadow-lg">
        <div class="text-center">
            <h1 class="font-heading text-3xl font-extrabold text-zinc-900">Welcome Back</h1>
            <p class="text-xs text-zinc-600 mt-1">Log in to manage your bookings and reserve movie tickets</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-semibold text-zinc-700 mb-1">Username</label>
                <input type="text" name="username" required class="w-full bg-white border border-zinc-300 rounded-xl px-4 py-3 text-sm text-zinc-900 focus:outline-none focus:border-red-600 shadow-sm">
            </div>

            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-xs font-semibold text-zinc-700">Password</label>
                    <a href="{% url 'accounts:password_reset' %}" class="text-xs text-red-600 font-semibold hover:underline">Forgot Password?</a>
                </div>
                <input type="password" name="password" required class="w-full bg-white border border-zinc-300 rounded-xl px-4 py-3 text-sm text-zinc-900 focus:outline-none focus:border-red-600 shadow-sm">
            </div>

            <div class="text-right">
                <a href="{% url 'accounts:forgot_username' %}" class="text-xs text-zinc-500 hover:text-zinc-800 font-medium hover:underline">Forgot Username?</a>
            </div>

            <button type="submit" class="btn-gradient w-full py-3.5 rounded-xl font-bold text-white text-sm shadow-xl">
                Log In
            </button>
        </form>

        <p class="text-xs text-center text-zinc-600">
            Don't have an account? <a href="{% url 'accounts:register' %}" class="text-red-600 font-bold hover:underline">Sign up now</a>
        </p>
    </div>
</div>
{% endblock %}
